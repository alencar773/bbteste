    /* =========================
       MENU MOBILE
    ========================= */

    const menuButton =
        document.getElementById("menuButton");

    const navMenu =
        document.getElementById("navMenu");


    menuButton.addEventListener("click", () => {

        navMenu.classList.toggle("active");

        if (navMenu.classList.contains("active")) {

            menuButton.textContent = "✕";

        } else {

            menuButton.textContent = "☰";

        }

    });


    /* FECHAR MENU AO CLICAR */

    document.querySelectorAll("#navMenu a").forEach(link => {

        link.addEventListener("click", () => {

            navMenu.classList.remove("active");

            menuButton.textContent = "☰";

        });

    });


    /* =========================

    ========================= */

        {

        },

        {

        },

        },

        {

            destinations: ["Anamã", "Anori"],
            arrival: "Segunda e sexta-feira",
            departure: "Terça-feira e sexta-feira — 12:00"
        },

        {

            destinations: ["Anori"],

        },

        {

        },

        },

        {

            departure: "Quarta-feira — 18:00"
        },

        {

            destinations: ["Itapiranga", "S.S. Uatumã", "Urucará"],

        },

        {

        },

        {

        },

        {

        },

        {

        },

        },

        {

        },

        {

        },

        {

            arrival: "Não disponível",
            departure: "Não disponível"
        },

        {
            name: "Jesus te ama",
            destinations: ["Carauri"],
            arrival: "Não disponível",
            departure: "Não disponível"
        },

        {
            name: "Vovô Chicão",
            destinations: ["Beruri"],
            arrival: "Quarta-feira",
            departure: "Sexta-feira — 12:00"
        },

        {
            name: "Nova Conquista",
            destinations: ["Beruri"],
            arrival: "Sexta-feira",
            departure: "Sábado — 12:00"
        },

        {
            name: "Maresia",
            destinations: ["Lábrea"],
            arrival: "Não disponível",
            departure: "Não disponível"
        },

        {
            name: "Lady Mary",
            destinations: ["Anori", "Anamã"],
            arrival: "Quinta-feira",
            departure: "Sexta-feira — 12:00"
        }

    ];


    const boatList =
        document.getElementById("boatList");

    const searchInput =
        document.getElementById("searchInput");

    const destinationFilter =
        document.getElementById("destinationFilter");

    const dayFilter =
        document.getElementById("dayFilter");

    const destinationsGrid =
        document.getElementById("destinationsGrid");


    /* =========================
       DESTINOS
    ========================= */

    const destinations = [
        ...new Set(
            boats.flatMap(
                boat => boat.destinations
            )
        )
    ].sort();


    destinations.forEach(destination => {

        const option =
            document.createElement("option");

        option.value = destination;

        option.textContent = destination;

        destinationFilter.appendChild(option);

    });


    /* =========================
       NORMALIZAR TEXTO
    ========================= */

    function normalize(text) {

        return text
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();

    }


    /* =========================
       FILTRO DE DIAS
    ========================= */

    function boatMatchesDay(
        boat,
        selectedDay
    ) {

        if (selectedDay === "all") {
            return true;
        }

        const arrival =
            normalize(boat.arrival);

        const departure =
            normalize(boat.departure);

        const text =
            arrival + " " + departure;

        const dayMap = {

            segunda: "segunda",
            terca: "terca",
            quarta: "quarta",
            quinta: "quinta",
            sexta: "sexta",
            sabado: "sabado",
            domingo: "domingo"

        };

        return text.includes(
            dayMap[selectedDay]
        );

    }


    /* =========================
       RENDER EMBARCAÇÕES
    ========================= */

    function renderBoats() {

        const search =
            normalize(
                searchInput.value.trim()
            );

        const selectedDestination =
            destinationFilter.value;

        const selectedDay =
            dayFilter.value;


        const filteredBoats =
            boats.filter(boat => {

                const matchesSearch =
                    normalize(
                        boat.name
                    ).includes(search);


                const matchesDestination =
                    selectedDestination === "all" ||
                    boat.destinations.includes(
                        selectedDestination
                    );


                const matchesDay =
                    boatMatchesDay(
                        boat,
                        selectedDay
                    );


                return (
                    matchesSearch &&
                    matchesDestination &&
                    matchesDay
                );

            });


        boatList.innerHTML = "";


        if (filteredBoats.length === 0) {

            boatList.innerHTML = `
                <div class="empty-message">
                    Nenhuma embarcação encontrada.
                </div>
            `;

            return;

        }


        filteredBoats.forEach(
            (boat, index) => {

                const unavailable =
                    boat.arrival === "Não disponível" &&
                    boat.departure === "Não disponível";


                const card =
                    document.createElement("div");

                card.className =
                    "boat-card";


                card.innerHTML = `

                    <div class="boat-top">

                        <h3 class="boat-name">
                            ${boat.name}
                        </h3>

                        <span class="status ${
                            unavailable
                            ? "unavailable"
                            : "available"
                        }">

                            ${
                                unavailable
                                ? "Sem previsão"
                                : "Programado"
                            }

                        </span>

                    </div>


                    <div class="boat-info">

                        <strong>🛬 Chegada:</strong><br>

                        ${
                            unavailable
                            ? "Sem previsão"
                            : boat.arrival
                        }

                    </div>


                    <div class="boat-info">

                        <strong>🛫 Saída:</strong><br>

                        ${
                            unavailable
                            ? "Sem previsão"
                            : boat.departure
                        }

                    </div>


                    ${
                        unavailable
                        ? `

                            <a
                                href="https://wa.me/5592991496097"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="contact-boat-button"
                            >
                                💬 Fale conosco
                            </a>

                        `
                        : ""
                    }


                    <div class="boat-info">

                        <strong>
                            ⚓ Destinos:
                        </strong>

                    </div>


                    <div class="boat-destinations">

                        ${
                            boat.destinations
                            .map(
                                destination => `

                                    <span class="destination-tag">
                                        ${destination}
                                    </span>

                                `
                            )
                            .join("")
                        }

                    </div>

                `;


                boatList.appendChild(card);


                setTimeout(() => {

                    card.classList.add("show");

                }, index * 45);

            }
        );

    }


    /* =========================
       RENDER DESTINOS
    ========================= */

    function renderDestinations() {

        destinationsGrid.innerHTML = "";


        destinations.forEach(
            destination => {

                const amount =
                    boats.filter(
                        boat =>
                            boat.destinations.includes(
                                destination
                            )
                    ).length;


                const card =
                    document.createElement("div");

                card.className =
                    "destination-card";


                card.innerHTML = `

                    <h3>
                        ${destination}
                    </h3>

                    <p>

                        ${amount}

                        ${
                            amount === 1
                            ? "embarcação"
                            : "embarcações"
                        }

                    </p>

                `;


                card.addEventListener(
                    "click",
                    () => {

                        destinationFilter.value =
                            destination;

                        dayFilter.value =
                            "all";

                        renderBoats();

                        document
                            .getElementById(
                                "programacao"
                            )
                            .scrollIntoView({
                                behavior: "smooth"
                            });

                    }
                );


                destinationsGrid
                    .appendChild(card);

            }
        );

    }


    /* =========================
       EVENTOS
    ========================= */

    searchInput.addEventListener(
        "input",
        renderBoats
    );


    destinationFilter.addEventListener(
        "change",
        renderBoats
    );


    dayFilter.addEventListener(
        "change",
        renderBoats
    );


    /* =========================
       INICIAR
    ========================= */

    renderBoats();

    renderDestinations();

</script>
